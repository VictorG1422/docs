site_name: Victor's Dev Docs
site_description: Personal development documentation hub
site_url: https://victorg1422.github.io/docs/
repo_url: https://github.com/VictorG1422/docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Trading Platform:
      - Overview: trading-platform/index.md
      - Flow, Strategy Logic & Diagrams: trading-platform/flow-and-examples.md
      - How-To Guide: trading-platform/how-to.md
      - FAQ: trading-platform/faq.md
      - Architecture & Data Flow: trading-platform/architecture.md
      - Module Reference: trading-platform/module-reference.md
      - Setup & Configuration: trading-platform/setup.md
      - Operations (Docker/Postgres/Redis/Logging): trading-platform/operations.md
      - Testing: trading-platform/testing.md
      - Safety Mechanisms & Roadmap: trading-platform/safety-and-limitations.md
      - Strategy Specification: trading-platform/strategy-specification.md
      - History (how this was built):
          - Overview: trading-platform/history/index.md
          - "00 — Project Initialization": trading-platform/history/specs/00-project-initialization.md
          - "Phase 1 — Foundation": trading-platform/history/specs/01-phase1.md
          - "Phase 2 — PostgreSQL": trading-platform/history/specs/02-phase2.md
          - "Phase 3 — Redis": trading-platform/history/specs/03-phase3.md
          - "Phase 4 — Broker & Market Data": trading-platform/history/specs/04-phase4.md
          - "Phase 5 — Instrument Discovery & Option Chain": trading-platform/history/specs/05-phase5.md
          - "Phase 6 — Market Data & TA Engine": trading-platform/history/specs/06-phase6.md
          - "Phase 7 — Strategy & Signal Engine": trading-platform/history/specs/07-phase7.md
          - "Phase 8 — Risk & Position Management": trading-platform/history/specs/08-phase8.md
          - "Phase 9 — Order Execution": trading-platform/history/specs/09-phase9.md
          - "Phase 10 — Broker Reconciliation": trading-platform/history/specs/10-phase10.md
          - "Phase 11 — Backtesting & Paper Trading": trading-platform/history/specs/11-phase11.md
