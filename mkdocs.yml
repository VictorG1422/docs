site_name: Victor's Dev Docs
site_description: Personal development documentation hub
site_url: https://victorg1422.github.io/docs/
repo_url: https://github.com/VictorG1422/docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Trading Platform:
      - Overview: trading-platform/index.md
      - Flow, Strategy Logic & Diagrams: trading-platform/flow-and-examples.md
      - How-To Guide: trading-platform/how-to.md
      - FAQ: trading-platform/faq.md
      - Architecture & Data Flow: trading-platform/architecture.md
      - Module Reference: trading-platform/module-reference.md
      - Setup & Configuration: trading-platform/setup.md
      - Operations (Docker/Postgres/Redis/Logging): trading-platform/operations.md
      - Testing: trading-platform/testing.md
      - Safety Mechanisms & Roadmap: trading-platform/safety-and-limitations.md
      - Strategy Specification: trading-platform/strategy-specification.md
